name: Build and test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'wheel/**'
      - 'runci/**'
  release:
    types:
      - created
      - edited
  schedule:
    # 04:00 every Tuesday morning
    - cron: '0 4 * * 2'

jobs:
  qir-checks:
    name: QIR - Build and test module
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: '0'
        submodules: true
    - run: git fetch --depth=1 origin +refs/tags/*:refs/tags/* +refs/heads/*:refs/remotes/origin/*
    - name: Set up Python 3.10
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Set up uv
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: astral-sh/setup-uv@v8.1.0
    - name: Build and test (3.10)
      if: github.event_name == 'push' || github.event_name == 'schedule'
      shell: bash
      run: |
        ./.github/workflows/build-test
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.1.0
    - name: Build and test including remote checks (3.11)
      if:  (matrix.os == 'macos-latest') && (github.event_name == 'push' || (github.event_name == 'pull_request' &&  github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'release' || github.event_name == 'schedule' )
      shell: bash
      run: |
        ./.github/workflows/build-test
      env:
        RUN_REMOTE_TESTS: 1
    - name: Build and test including remote checks (3.11)
      if:  (matrix.os != 'macos-latest') && (github.event_name == 'push' || (github.event_name == 'pull_request' &&  github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'release' || github.event_name == 'schedule')
      shell: bash
      run: |
        ./.github/workflows/build-test
      env:
        RUN_REMOTE_TESTS: 1
    - name: Set up Python 3.12
      if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule'
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Set up uv
      if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule'
      uses: astral-sh/setup-uv@v8.1.0
    - name: Build and test (3.12)
      if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule'
      shell: bash
      run: |
        ./.github/workflows/build-test
    - uses: actions/upload-artifact@v7
      if: (github.event_name == 'release' || contains(github.ref, 'refs/heads/wheel')) && matrix.os == 'ubuntu-latest'
      with:
        name: artefact-${{ matrix.os }}
        path: wheelhouse/


  publish_to_pypi:
    name: Publish to pypi
    if: github.event_name == 'release'
    needs: qir-checks
    runs-on: ubuntu-latest
    steps:
    - name: Download release wheel
      # This is currently a pure Python wheel, so publish the Ubuntu artifact
      # instead of merging same-named matrix outputs.
      uses: actions/download-artifact@v8
      with:
        path: wheelhouse
        name: artefact-ubuntu-latest
    - name: Put wheel in the dist folder
      run: |
        mkdir dist
        cp wheelhouse/*.whl dist/
    - name: Publish wheels
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_QIRCHECK_API_TOKEN }}
        verbose: true
